<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101B2B" />
    <meta name="description" content="Explore the software ecosystem from Castle Advanced Technologies & Systems." />
    <script>
      // Scroll reveals hide content only when JavaScript runs. If the app never starts, show everything.
      document.documentElement.classList.add("js");
      addEventListener("load", function () {
        setTimeout(function () {
          if (!window.__revealsStarted) document.documentElement.classList.remove("js");
        }, 2000);
      });
    </script>
    <title>CATS Software | Beyond Sensing. Into Intelligence.</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
