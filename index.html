    <script>
      // Scroll reveals hide content only when JavaScript runs. If the app never starts, show everything.
      (function () {
        var root = document.documentElement;
        root.classList.add("js");
        // Scroll-linked effects only where motion is welcome.
        if (!matchMedia("(prefers-reduced-motion: reduce)").matches) root.classList.add("scroll-fx");
        addEventListener("load", function () {
          setTimeout(function () {
            if (!window.__revealsStarted) root.classList.remove("js", "scroll-fx");
          }, 2000);
        });
      })();
    </script>
